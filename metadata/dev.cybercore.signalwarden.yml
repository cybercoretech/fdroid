Name: SignalWarden
Summary: See what your connection is doing, and keep the diagnostics on your phone
Description: |-
  Network diagnostics with clear privacy boundaries. SignalWarden shows what
  Android knows about your active connection, and on demand measures how long
  DNS, the TCP connect and a certificate-verified TLS handshake take.

  * Transport, validated-internet and metered state, and whether a VPN is active
  * Interface, addresses, DNS servers, proxy and routes
  * On-tap latency breakdown: resolver, TCP and TLS, each timed separately
  * No account, analytics, stored history or SignalWarden server

  It isn't a VPN or packet analyzer, and nothing runs in the background.
