
name: Deploy F-Droid to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '**/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:react

      - name: Install Wrangler
        run: npm install --global wrangler@3.90.0

      - name: Sync repository to R2
        env:
          R2_BUCKET: fdroid-repo
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d repo ]; then
            echo "ERROR: repo directory does not exist"
            exit 1
          fi

          while IFS= read -r -d '' file; do
            rel_path="${file#./}"

            echo "Uploading ${rel_path}"

            wrangler r2 object put \
              "${R2_BUCKET}/${rel_path}" \
              --file "$file" \
              --remote

          done < <(find repo -type f -print0)

      - name: Deploy Cloudflare Pages
        run: |
          wrangler pages deploy ./dist \
            --project-name fdroid-pages \
            --branch main

