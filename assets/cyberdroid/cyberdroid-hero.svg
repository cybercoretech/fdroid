<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc">
  <title id="title">CyberDroid signal-grid background</title>
  <desc id="desc">A static dark technical field with an original armored CyberDroid guardian, reactor circuits, and repository telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1120" gradientUnits="userSpaceOnUse"><stop stop-color="#080c14"/><stop offset=".52" stop-color="#0a1119"/><stop offset="1" stop-color="#090b13"/></linearGradient>
    <linearGradient id="armor" x1="1180" y1="92" x2="1770" y2="1040" gradientUnits="userSpaceOnUse"><stop stop-color="#9fb5b6"/><stop offset=".2" stop-color="#354c57"/><stop offset=".53" stop-color="#172630"/><stop offset=".8" stop-color="#0e1a24"/><stop offset="1" stop-color="#536b72"/></linearGradient>
    <linearGradient id="visor" x1="1170" y1="414" x2="1740" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#29dfd2"/><stop offset=".55" stop-color="#d2ffe8"/><stop offset="1" stop-color="#79c5dd"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#e5fff3"/><stop offset=".15" stop-color="#9affd5"/><stop offset=".48" stop-color="#00dfcf"/><stop offset="1" stop-color="#00809a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#8197a2" stroke-opacity=".09" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#070b12" stop-opacity=".05"/><stop offset=".38" stop-color="#070b12" stop-opacity=".18"/><stop offset=".62" stop-color="#070b12" stop-opacity=".08"/><stop offset="1" stop-color="#070b12" stop-opacity=".16"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="23"/></filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <path fill="url(#bg)" d="M0 0h1920v1120H0z"/><path fill="url(#grid)" d="M0 0h1920v1120H0z"/>
