    <path d="M651 174h82m102 0h82m-408 231h47m657 0h48" stroke="#67d5cf" stroke-width="5"/>
    <circle cx="613" cy="427" r="8" fill="#b4f39b"/><circle cx="955" cy="427" r="8" fill="#b4f39b"/>
