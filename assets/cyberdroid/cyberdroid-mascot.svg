<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">CyberDroid, Cybercore repository guardian</title>
  <desc id="desc">An original armored cybernetic courier with a split optical visor, layered graphite plating, and a cyan reactor core.</desc>
  <defs>
    <linearGradient id="shell" x1="105" y1="80" x2="530" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#a7c4ce"/><stop offset=".18" stop-color="#435864"/><stop offset=".46" stop-color="#1b2934"/><stop offset=".76" stop-color="#101b25"/><stop offset="1" stop-color="#667c83"/></linearGradient>
    <linearGradient id="face" x1="200" y1="170" x2="440" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#263943"/><stop offset=".55" stop-color="#0b151d"/><stop offset="1" stop-color="#17252e"/></linearGradient>
    <linearGradient id="visor" x1="178" y1="268" x2="455" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#00f0d8"/><stop offset=".46" stop-color="#9effd5"/><stop offset=".72" stop-color="#65d9ff"/><stop offset="1" stop-color="#8f83ff"/></linearGradient>
    <radialGradient id="reactor"><stop stop-color="#eafffc"/><stop offset=".15" stop-color="#98fff0"/><stop offset=".35" stop-color="#00e8d2"/><stop offset=".72" stop-color="#0382a7"/><stop offset="1" stop-color="#101e2b"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
